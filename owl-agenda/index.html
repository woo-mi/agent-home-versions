<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <meta name="description" content="Owl chat thread prototype agenda.">
    <title>Owl · Chat thread</title>
    <style>
      * { box-sizing: border-box; }
      html { background: #fff; }
      body {
        margin: 0;
        color: #1c1c1c;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        width: min(100%, 1080px);
        padding: 44px 48px 64px;
      }
      h1 {
        margin: 0 0 44px;
        font-size: 40px;
        line-height: 1.2;
        font-weight: 600;
        letter-spacing: -0.8px;
      }
      h2 {
        margin: 0 0 20px;
        color: #686868;
        font-size: 28px;
        line-height: 1.25;
        font-weight: 500;
      }
      ul {
        display: grid;
        gap: 24px;
        margin: 0;
        padding: 30px 40px;
        list-style: none;
        border: 2px solid #e7e7e7;
        border-radius: 20px;
      }
      li {
        color: #515151;
        font-size: 30px;
        line-height: 1.4;
        font-weight: 400;
        overflow-wrap: anywhere;
      }
      @media (max-width: 600px) {
        main { padding: 32px 24px 48px; }
        h1 { margin-bottom: 36px; font-size: 34px; }
        h2 { font-size: 23px; margin-bottom: 16px; }
        ul { gap: 20px; padding: 24px; border-radius: 18px; }
        li { font-size: 21px; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Owl</h1>
      <section aria-labelledby="chat-agenda">
        <h2 id="chat-agenda">Chat thread</h2>
        <ul>
          <li>one thread</li>
          <li>one thread with sub chat - Slack</li>
          <li>one thread with sub chat - Inline</li>
        </ul>
      </section>
    </main>
  </body>
</html>
