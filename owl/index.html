<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <meta name="description" content="Owl chat thread and navigator prototype agenda.">
    <title>Owl</title>
    <style>
      * { box-sizing: border-box; }
      html { background: #fff; }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 40px 24px;
        color: #1c1c1c;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        width: min(100%, 600px);
      }
      h1 {
        margin: 0 0 28px;
        font-size: 28px;
        line-height: 1.2;
        font-weight: 600;
        letter-spacing: -0.4px;
      }
      h2 {
        margin: 0 0 12px;
        color: #686868;
        font-size: 18px;
        line-height: 1.4;
        font-weight: 500;
      }
      section + section { margin-top: 28px; }
      ul {
        display: grid;
        gap: 16px;
        margin: 0;
        padding: 20px 24px;
        list-style: none;
        border: 1px solid #e7e7e7;
        border-radius: 14px;
      }
      li {
        color: #515151;
        font-size: 18px;
        line-height: 1.5;
        font-weight: 400;
        overflow-wrap: anywhere;
      }
      @media (max-width: 600px) {
        body { padding: 32px 24px; }
        h1 { font-size: 26px; }
        ul { padding: 20px; }
        li { font-size: 16px; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Owl</h1>
      <section aria-labelledby="chat-agenda">
        <h2 id="chat-agenda">Chat thread</h2>
        <ul>
          <li>one thread</li>
          <li>one thread with sub chat - Slack</li>
          <li>one thread with sub chat - Inline</li>
        </ul>
      </section>
      <section aria-labelledby="navigator-agenda">
        <h2 id="navigator-agenda">Navigator</h2>
        <ul>
          <li>categorized by timeline</li>
          <li>categorized by features</li>
        </ul>
      </section>
    </main>
  </body>
</html>
