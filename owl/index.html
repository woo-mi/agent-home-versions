<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <meta name="description" content="Owl prototyping overview.">
    <title>Owl</title>
    <style>
      * { box-sizing: border-box; }
      html { background: #fff; }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 40px 24px;
        color: #1c1c1c;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        width: min(100%, 600px);
      }
      h1 {
        margin: 0 0 28px;
        font-size: 28px;
        line-height: 1.2;
        font-weight: 600;
        letter-spacing: -0.4px;
      }
      h2 {
        margin: 0;
        color: #686868;
        font-size: 18px;
        line-height: 1.4;
        font-weight: 500;
      }
      h2 + h2 { margin-top: 24px; }
      @media (max-width: 600px) {
        body { padding: 32px 24px; }
        h1 { font-size: 26px; }
        h2 { font-size: 16px; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Owl</h1>
      <h2>Prototyping 1</h2>
      <h2>Prototyping 2</h2>
      <h2>The latest Prototyping</h2>
    </main>
  </body>
</html>
